services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/lmatospereira/financial-ledger:latest
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/livro_caixa.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
    volumes:
      # Persist the SQLite .db file across container restarts/redeploys.
      - ./data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
