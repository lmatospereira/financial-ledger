name: Release

# Every push to develop tries to cut a new release/* branch + PR into main,
# unless one is already in flight (see the "check" step below) — this keeps
# release branches roughly one-per-batch-of-develop-changes instead of
# stacking a new one on every single merge.
on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      # Checkout with a real PAT (not the default GITHUB_TOKEN): pushes and
      # PRs made with the built-in token don't trigger new workflow runs
      # (GitHub's anti-recursion protection), which would silently stop CI
      # from ever running on the release branch this job creates.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_AUTOMATION_TOKEN }}

      - name: Check for an already-open release PR
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          count=$(gh pr list --repo "${{ github.repository }}" --base main --state open \
            --json headRefName --jq '[.[] | select(.headRefName | startswith("release/"))] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "An open release/* PR into main already exists — skipping." >&2
          fi

      # Without this guard, the post-release "sync main back into develop"
      # PR (see post-release.yml) pushes a commit to develop that itself
      # triggers this workflow again — with nothing but the VERSION bump
      # as a "change", producing an infinite chain of no-op releases. Only
      # cut a release when develop actually differs from main beyond the
      # VERSION file itself.
      - name: Check for changes not yet in main
        id: diff
        if: steps.check.outputs.count == '0'
        run: |
          set -euo pipefail
          git fetch origin main
          if git diff --quiet origin/main HEAD -- . ':!VERSION'; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "develop has no changes beyond main (besides VERSION) — skipping release." >&2
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump VERSION and create release branch
        if: steps.check.outputs.count == '0' && steps.diff.outputs.has_changes == 'true'
        id: bump
        run: |
          set -euo pipefail
          # Source of truth is the highest existing git tag, not develop's
          # own VERSION file: the file only gets updated once the
          # post-release main->develop sync PR merges, so cutting a release
          # before that sync lands re-bumps from a stale value and produces
          # a version that collides with one already tagged (this happened
          # in practice: two releases both computed "0.1.4"). Tags are
          # updated atomically at tag-creation time, so they can't drift.
          git fetch origin --tags
          latest_tag=$(git tag -l 'v*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [ -n "$latest_tag" ]; then
            current="$latest_tag"
          else
            current=$(tr -d '[:space:]' < VERSION)
          fi
          IFS='.' read -r major minor patch <<< "$current"
          new_patch=$((patch + 1))
          new_version="${major}.${minor}.${new_patch}"
          branch="release/v${new_version}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          echo "$new_version" > VERSION
          git add VERSION
          git commit -m "chore(release): bump version to v${new_version}"
          git push origin "$branch"

          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open release PR into main
        if: steps.check.outputs.count == '0' && steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          body=$(printf 'Auto-generated release PR bumping `VERSION` to `%s`.\n\nThis branch deploys to the **hml** environment on push. Please validate it there before merging into `main` (which deploys to **prod**).' "${{ steps.bump.outputs.version }}")
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "${{ steps.bump.outputs.branch }}" \
            --title "Release v${{ steps.bump.outputs.version }}" \
            --body "$body"
