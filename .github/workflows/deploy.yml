name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, develop, "release/**"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lmatospereira/financial-ledger

# Second layer of protection against concurrent same-environment deploys
# (the primary fix is the concurrency group on ci.yml itself, which stops
# the duplicate workflow_run events from firing in the first place). Queue
# rather than cancel: an in-progress `docker compose up -d` shouldn't be
# killed mid-flight. Keyed on head_branch (== environment 1:1) since that's
# known before the job runs, unlike the envmap step's output.
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Only deploy once CI ("CI" workflow, from ci.yml) has actually passed
    # for this push — workflow_run is what makes "after CI passes" true
    # instead of just "in parallel with CI".
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
      # Needed by the GHA cache exporter below (cache-to: type=gha) — without
      # it, cache writes fail with "token has no writable scopes" and can
      # take the whole build down with them.
      actions: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      skip: ${{ steps.envmap.outputs.skip }}
      dir: ${{ steps.envmap.outputs.dir }}
      port: ${{ steps.envmap.outputs.port }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Map branch to target environment
        id: envmap
        run: |
          set -euo pipefail
          branch="${{ github.event.workflow_run.head_branch }}"
          sha="${{ github.event.workflow_run.head_sha }}"
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          if [ "$branch" = "main" ]; then
            name=prod; port=80; tag=latest; dir=financial-ledger
          elif [ "$branch" = "develop" ]; then
            name=dev; port=8080; tag=dev; dir=financial-ledger-dev
          elif [[ "$branch" == release/* ]]; then
            name=hml; port=8081; tag=hml; dir=financial-ledger-hml
          else
            # Defensive: shouldn't happen given the workflow_run branches
            # filter above, but skip cleanly rather than deploying blind.
            echo "Unrecognized branch '$branch' — skipping deploy." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

          {
            echo "tags<<EOF"
            echo "${image}:${tag}"
            echo "${image}:${sha}"
            if [ "$name" = "prod" ]; then
              version=$(tr -d '[:space:]' < VERSION)
              echo "${image}:v${version}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.envmap.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.envmap.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.envmap.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.envmap.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # VPS is an Oracle Ampere (aarch64) instance — GitHub's runners are
          # amd64, so this cross-builds via QEMU emulation set up above.
          platforms: linux/arm64
          push: true
          tags: ${{ steps.envmap.outputs.tags }}
          # Scoped per environment — dev/hml/prod can build concurrently
          # (e.g. right after a release merge triggers a develop sync-back),
          # and a shared cache scope causes them to collide on the same
          # cache key and fail the whole build.
          cache-from: type=gha,scope=${{ steps.envmap.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ steps.envmap.outputs.name }}

      - id: image
        if: steps.envmap.outputs.skip != 'true'
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: needs.build-and-push.outputs.skip != 'true'
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/${{ needs.build-and-push.outputs.dir }}
            docker compose pull
            docker compose up -d

      - name: Smoke test
        # prod (port 80) is reachable on the bare host without a port
        # suffix; dev/hml are on non-standard ports and need one.
        run: |
          port="${{ needs.build-and-push.outputs.port }}"
          if [ "$port" = "80" ]; then
            curl -sf "http://${{ secrets.VPS_HOST }}/api/health"
          else
            curl -sf "http://${{ secrets.VPS_HOST }}:${port}/api/health"
          fi
