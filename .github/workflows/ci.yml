name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# A push to a branch with an open PR fires both the push and pull_request
# events for the same commit, running this workflow twice in parallel and
# — since each completion independently triggers deploy.yml via workflow_run
# — causing two concurrent deploys to the same environment that collide on
# the shared GHA build cache. Cancel the redundant run instead.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pytest
        run: pytest backend/
        working-directory: .

      - name: Lint with ruff
        run: pip install ruff && ruff check backend/

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
