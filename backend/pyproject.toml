[tool.ruff.lint]
# Explicit rule selection so `ruff check` behavior doesn't silently change
# across ruff releases (this bit us: an unpinned ruff started enabling
# bugbear's B008 by default, which flags FastAPI's idiomatic
# `Depends(...)` as a function-call-in-default-argument "bug" — it isn't).
# E4/E7/E9/F is ruff's own long-standing default set (real correctness
# issues), which is what this project actually wants from CI lint.
select = ["E4", "E7", "E9", "F"]
